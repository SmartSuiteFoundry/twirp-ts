name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # semantic-release pushes the release commit and tag, and creates the release.
  contents: write
  issues: write
  pull-requests: write
  # Lets npm exchange a short-lived OIDC token with the registry, so this
  # workflow needs no npm token. Requires a trusted publisher configured at
  # https://www.npmjs.com/package/@smartsuite-foundry/twirp-ts/access
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release works out the last release from the tags.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # Trusted publishing needs npm 11.5.1+, newer than the bundled npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
