name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Lets npm exchange a short-lived OIDC token with the registry, so this
  # workflow needs no npm token. Requires a trusted publisher configured at
  # https://www.npmjs.com/package/@smartsuite-foundry/twirp-ts/access
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # Trusted publishing needs npm 11.5.1+, newer than the bundled npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - name: Check the release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: npm publish --provenance
