name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm exchange a short-lived OIDC token with the registry, so this
  # workflow needs no npm token. Requires a trusted publisher configured at
  # https://www.npmjs.com/package/@smartsuite-foundry/twirp-ts/access
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release works out the last release from the tags.
          fetch-depth: 0
          # The release commit goes straight to main, which the ruleset only
          # allows for the admins team, so it is pushed as ci-smartsuite.
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Trusted publishing needs npm 11.5.1+, newer than the bundled npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
